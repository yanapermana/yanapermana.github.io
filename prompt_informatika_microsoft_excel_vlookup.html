C. INTI PEMBELAJARAN
1. AWAL (berkesadaran, bermakna) (durasi 10 menit)
- Guru menyapa murid, berdoa bersama, dan menciptakan suasana belajar yang menyenangkan
- Guru mengabsen nama murid dan menanyakan “Bagaimana perasaan hari ini?” kepada murid untuk mengetahui kondisi sosial dan emosional
- Guru membagikan link website multimedia pembelajaran interaktif
- Guru menyampaikan capaian pembelajaran dan tujuan pembelajaran yang ingin dicapai
- Pertanyaan pemantik:
-- “Bagaimana cara mencari data tertentu secara otomatis dari sebuah tabel tanpa harus mencarinya satu per satu?”
- Guru memberikan motivasi kepada murid

2. INTI (bermakna, menggembirakan) (durasi 75 menit)
Pada tahap ini, murid aktif terlibat dalam pengalaman belajar memahami, mengaplikasi, dan merefleksi. Guru menerapkan prinsip pembelajaran berkesadaran, bermakna, menyenangkan untuk mencapai tujuan pembelajaran. Pengalaman belajar tidak harus dilaksanakan dalam satu kali pertemuan.

a. Memahami (bermakna, menggembirakan) (eksplorasi dan diskusi - 10 menit)
	1.	Guru menampilkan video singkat (1-5 menit) sesuai topik pembelajaran
	2.	Guru mengajak murid untuk berdiskusi tentang informasi tersebut
	3.	Murid mengeskplorasi informasi sesuai topik pembelajaran
	4.	Murid dapat berdiskusi secara langsung dengan guru atau murid lain jika ada kesulitan dalam mengerjakan praktikum

b. Mengaplikasi (bermakna, menggembirakan) (project based learning dan demonstrasi - 60 menit)
	1. Menentukan project
	- Murid berkolaborasi dengan baik dan benar
	- Murid diberikan jobsheet/LKPD sesuai topik pembelajaran
	- Murid mengerjakan secara berkelompok 2-3 orang

	2. Demonstrasi langkah-langkah penyelesaian project
	- Guru mendemonstrasikan langkah-langkah pengerjaan jobsheet/LKPD

	3. Penyelesaian project dengan dibimbing guru
	- Murid mengerjakan jobsheet/LKPD
	- Murid memeriksa peralatan sesuai topik pembelajaran
	- Murid melaksanakan praktik sesuai panduan jobsheet/LKPD
	- Murid mengecek hasil praktik

c. Merefleksi (berkesadaran, bermakna) (refleksi - 5 menit)
	1.	Murid menuliskan refleksi singkat tentang pengalaman belajar hari ini

3. PENUTUP (berkesadaran) (durasi - 5 menit)
Tahap akhir dalam proses pembelajaran yang bertujuan memberikan umpan balik yang konstruktif kepada murid atas pengalaman belajar yang telah dilakukan, menyimpulkan pembelajaran, dan murid terlibat dalam perencanaan pembelajaran selanjutnya.


D. ASESMEN PEMBELAJARAN
1. Asesmen pada Awal Pembelajaran
- Guru dan murid menyimpulkan pembelajaran sesuai topik pembelajaran.
2. Asesmen pada Proses Pembelajaran
- Guru mengajak murid merencanakan pembelajaran selanjutnya dan strategi belajar yang akan digunakan. Topik yang akan dipelajari pertemuan yang akan datang
3. Asesmen pada Akhir Pembelajaran
- Guru memuliakan murid dengan menghargai pencapaian proyeknya

4. Asesmen Formatif
- Kognitif		: Kuis lisan singkat 3 pertanyaan
- Afektif		: Keterlibatan murid dalam diskusi kelompok
- Psikomotorik	: Hasil praktik yang dikerjakan murid
