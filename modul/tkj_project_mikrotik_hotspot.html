<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Mikrotik Hotspot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #eef2f6; color: #1c2733; }
    .site-header { background: #14324a; color: #fff; border-bottom: 4px solid #2a9d8f; }
    .site-header h1 { font-weight: 700; letter-spacing: .2px; }
    .pdf-frame { position: relative; width: 100%; height: 80vh; min-height: 480px; background: #fff; }
    .pdf-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    @media (max-width: 576px) { .pdf-frame { height: 70vh; } }
  </style>
</head>
<body>
  <header class="site-header py-4">
    <div class="container">
      <h1 class="h2 mb-1">Project Mikrotik Hotspot</h1>
      <p class="mb-0 opacity-75">Dokumen konfigurasi Hotspot Voucher pada Mikrotik</p>
    </div>
  </header>

  <main class="container my-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="fw-semibold">Dokumen Project</span>
        <a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener"
           href="https://drive.google.com/file/d/1bCKWmSh2dsaUzkQXBf0xc9qoLXrpu38T/view">Buka di tab baru</a>
      </div>
      <div class="pdf-frame">
        <iframe src="https://drive.google.com/file/d/1bCKWmSh2dsaUzkQXBf0xc9qoLXrpu38T/preview"
                title="Project Mikrotik Hotspot (PDF)" allow="autoplay" loading="lazy"></iframe>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted small pb-4">
    &copy; 2026 Project Mikrotik Hotspot
  </footer>
</body>
</html>
