<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaringan Komputer Materi 2</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #ff6b00;
            --dark-orange: #e05e00;
            --light-orange-bg: #fff8f3;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light-orange-bg);
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar-orange {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.25);
        }

        .navbar-orange .navbar-brand {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-orange .nav-link {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            transition: color 0.2s ease-in-out;
        }

        .navbar-orange .nav-link:hover {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        /* Main Content Card */
        .content-card {
            background-color: #ffffff;
            border: 1px solid rgba(255, 107, 0, 0.2);
            border-top: 5px solid var(--primary-orange);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }

        /* Button Styling */
        .btn-orange {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #ffffff;
            font-weight: 500;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            border-color: var(--dark-orange);
            color: #ffffff;
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border-color: var(--primary-orange);
            font-weight: 500;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Responsive PDF Container */
        .pdf-wrapper {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating To Top Button */
        #btn-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: none;
            z-index: 99;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.4);
        }

        footer {
            margin-top: auto;
            background-color: #ffffff;
            border-top: 1px solid rgba(255, 107, 0, 0.15);
        }
    </style>
</head>
<body id="top">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-orange sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://yanapermana.github.io">
                <i class="bi bi-hdd-network me-2"></i>Yana Permana
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4 my-md-5">
        <div class="content-card p-3 p-md-5">
            
            <!-- Header & Back Button -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 pb-3 border-bottom gap-3">
                <h1 class="h2 page-title mb-0">Materi 2 Network Addressing</h1>
                <button type="button" onclick="goBack()" class="btn btn-outline-orange btn-sm px-3 py-2">
                    <i class="bi bi-arrow-left me-1"></i> Kembali
                </button>
            </div>

            <!-- Google Drive PDF Embed -->
            <div class="pdf-wrapper mb-4">
                <iframe 
                    src="https://drive.google.com/file/d/13D-dChCkzlLo9vspXbX9hkbBZYZvPb8K/preview" 
                    allow="autoplay" 
                    title="Materi 2 Network Addressing PDF">
                </iframe>
            </div>

            <!-- Bottom Navigation Buttons -->
            <div class="d-flex justify-content-between align-items-center pt-2">
                <button type="button" onclick="goBack()" class="btn btn-outline-orange">
                    <i class="bi bi-arrow-left me-1"></i> Halaman Sebelumnya
                </button>
                <a href="#top" class="btn btn-orange">
                    <i class="bi bi-arrow-up me-1"></i> Ke Atas
                </a>
            </div>

        </div>
    </main>

    <!-- Floating Back to Top Button -->
    <button type="button" class="btn btn-orange" id="btn-to-top" title="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center text-muted small">
        <div class="container">
            &copy; 2026 Yana Permana - Materi Jaringan Komputer
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Scripts -->
    <script>
        // Fungsi kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika halaman dibuka langsung di tab baru
                window.location.href = "https://yanapermana.github.io/modul/index.html";
            }
        }

        // Kontrol tombol melayang (Floating To Top) saat halaman di-scroll
        const toTopBtn = document.getElementById("btn-to-top");

        window.onscroll = function () {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                toTopBtn.style.display = "block";
            } else {
                toTopBtn.style.display = "none";
            }
        };

        toTopBtn.addEventListener("click", function () {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>
</body>
</html>
