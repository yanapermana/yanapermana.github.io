<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Optic Materi 3</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Kustomisasi Tema Warna Oranye & Putih */
        :root {
            --primary-orange: #FF6B00;
            --dark-orange: #E05E00;
            --light-orange: #FFF5ED;
        }

        body {
            background-color: #FFFFFF;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar-orange {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.2);
        }

        .navbar-orange .navbar-brand,
        .navbar-orange .nav-link {
            color: #FFFFFF !important;
            font-weight: 500;
        }

        .navbar-orange .nav-link:hover {
            background-color: var(--dark-orange);
            border-radius: 5px;
        }

        /* Header / Judul */
        .header-section {
            background-color: var(--light-orange);
            border-bottom: 3px solid var(--primary-orange);
            padding: 2rem 1rem;
            margin-bottom: 2rem;
        }

        .header-section h1 {
            color: var(--primary-orange);
            font-weight: 700;
        }

        /* Container PDF Responsif */
        .pdf-container {
            position: relative;
            width: 100%;
            height: 80vh; /* Tinggi 80% dari layar */
            min-height: 500px;
            border: 2px solid var(--primary-orange);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol Kustom Oranye */
        .btn-orange {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            border: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            background-color: #FFFFFF;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #FFFFFF;
        }

        /* Tombol Floating To Top */
        #btnToTop {
            display: none;
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 99;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.25rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        /* Footer */
        footer {
            margin-top: auto;
            background-color: var(--light-orange);
            border-top: 1px solid #ffe0c8;
            color: #666666;
        }
    </style>
</head>
<body>

    <!-- Menu Navigasi -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-orange sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="https://yanapermana.github.io">
                <i class="bi bi-router me-2"></i>Yana Permana
            </a>
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header Judul -->
    <header class="header-section text-center">
        <div class="container">
            <h1 class="display-6 mb-0">Materi 3 Project Jaringan Fiber Optic</h1>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="container mb-5">
        <!-- Bar Navigasi Atas (Tombol Back & Buka di Tab Baru) -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <button onclick="goBack()" class="btn btn-outline-orange">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </button>
            <a href="https://drive.google.com/file/d/1X7r2q5mJMOmGyK2D9eO7VdI47rl4qF_X/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn btn-orange btn-sm">
                <i class="bi bi-box-arrow-up-right me-1"></i> Buka PDF di Tab Baru
            </a>
        </div>

        <!-- Embed PDF Google Drive (Menggunakan /preview agar bisa di-embed) -->
        <div class="pdf-container">
            <iframe 
                src="https://drive.google.com/file/d/1X7r2q5mJMOmGyK2D9eO7VdI47rl4qF_X/preview" 
                allow="autoplay"
                title="PDF Materi 3 Project Jaringan Fiber Optic">
            </iframe>
        </div>

        <!-- Tombol Back Bawah -->
        <div class="mt-4">
            <button onclick="goBack()" class="btn btn-outline-orange">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Sebelumnya
            </button>
        </div>
    </main>

    <!-- Tombol Floating To Top -->
    <button onclick="scrollToTop()" id="btnToTop" class="btn btn-orange" title="Kembali ke atas">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <small>&copy; 2026 Yana Permana. All rights reserved.</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Tombol Back & To Top -->
    <script>
        // Fungsi kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika dibuka langsung di tab baru tanpa riwayat sebelumnya
                window.location.href = "https://yanapermana.github.io/modul/index.html";
            }
        }

        // Logika menampilkan tombol To Top saat halaman di-scroll
        const btnToTop = document.getElementById("btnToTop");
        window.onscroll = function() {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                btnToTop.style.display = "block";
            } else {
                btnToTop.style.display = "none";
            }
        };

        // Fungsi scroll halus ke bagian paling atas
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    </script>
</body>
</html>
