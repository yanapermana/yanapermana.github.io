<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Jaringan VoIP Telepon Internet</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --orange: #f97316;
      --orange-dark: #ea580c;
      --orange-light: #fff7ed;
    }

    body {
      background-color: #ffffff;
      color: #1f2937;
    }

    /* Navbar */
    .navbar {
      background-color: var(--orange) !important;
    }
    .navbar-brand {
      font-weight: 700;
      letter-spacing: .3px;
      color: #ffffff !important;
    }
    .navbar .nav-link {
      color: #ffffff !important;
      font-weight: 500;
    }
    .navbar .nav-link:hover,
    .navbar .nav-link:focus {
      color: #fff7ed !important;
      text-decoration: underline;
    }
    .navbar-toggler {
      border-color: rgba(255, 255, 255, .6);
    }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,0.9)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* Judul */
    .judul {
      font-weight: 700;
      color: var(--orange-dark);
    }

    /* Card video */
    .video-card {
      border: 2px solid var(--orange);
      border-radius: .75rem;
      overflow: hidden;
      background-color: #ffffff;
    }
    .video-card .card-body {
      background-color: var(--orange-light);
      border-top: 2px solid var(--orange);
    }
    .video-card .card-title {
      color: var(--orange-dark);
      font-weight: 600;
    }

    /* Footer */
    footer {
      font-size: .9rem;
      background-color: var(--orange) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navigasi -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="https://yanapermana.github.io">Yana Permana</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuUtama" aria-controls="menuUtama"
              aria-expanded="false" aria-label="Buka menu navigasi">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Konten -->
  <main class="container my-5 flex-grow-1">
    <h1 class="judul text-center mb-4">Project VoIP Telepon Internet</h1>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <div class="card video-card shadow">
          <div class="ratio ratio-16x9">
            <iframe src="https://www.youtube.com/embed/s7t5GFq19_Y"
                    title="Video 1 - Project VoIP Telepon Internet"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
          </div>
          <div class="card-body">
            <h2 class="h5 card-title mb-0">Video 1</h2>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3">
    <div class="container">&copy; 2026 Yana Permana</div>
  </footer>

  <!-- Bootstrap 5 JS (untuk menu hamburger di layar kecil) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
