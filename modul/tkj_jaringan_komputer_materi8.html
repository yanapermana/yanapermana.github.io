<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaringan Komputer Materi 8</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons untuk ikon tombol -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --primary-orange: #ff6600;
            --dark-orange: #cc5200;
            --light-orange: #fff5eb;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Tema Navbar Oranye */
        .navbar-custom {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #ffffff;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }

        .navbar-custom .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-custom .nav-link:hover {
            color: var(--light-orange);
            transform: translateY(-1px);
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.7);
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* Styling Heading */
        .page-header {
            border-bottom: 3px solid var(--primary-orange);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            color: var(--primary-orange);
            font-weight: 700;
        }

        /* Container PDF Responsif */
        .pdf-wrapper {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border: 2px solid var(--primary-orange);
            border-radius: 10px;
            overflow: hidden;
            background-color: var(--light-orange);
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.12);
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol Kustom Oranye */
        .btn-orange {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            color: #ffffff;
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            background-color: #ffffff;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Tombol Floating To Top */
        #btnToTop {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 99;
            display: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            align-items: center;
            justify-content: center;
        }

        /* Footer */
        footer {
            margin-top: auto;
            background-color: var(--light-orange);
            border-top: 2px solid var(--primary-orange);
            color: #555555;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://yanapermana.github.io">Yana Permana</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://drive.google.com/file/d/1yxK0tJKPnDczgNsOveoujgXVz3XrWtjO/view?usp=drive_link" target="_blank" rel="noopener noreferrer">
                            <i class="bi bi-file-earmark-text me-1"></i>Silabus / Referensi
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="container my-4">
        <!-- Tombol Back & Aksi Cepat -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <button onclick="goBack()" class="btn btn-outline-orange btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </button>
            <a href="https://drive.google.com/file/d/18JqmrslT8s2VVzNViSM2JzK7llVWHfoV/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn btn-orange btn-sm">
                <i class="bi bi-box-arrow-up-right me-1"></i> Buka PDF di Tab Baru
            </a>
        </div>

        <!-- Heading 1 -->
        <div class="page-header">
            <h1 class="h2 mb-0">Materi 8 Wireless Network</h1>
        </div>

        <!-- Embed PDF Google Drive -->
        <div class="pdf-wrapper mb-4">
            <iframe 
                src="https://drive.google.com/file/d/18JqmrslT8s2VVzNViSM2JzK7llVWHfoV/preview" 
                allow="autoplay" 
                title="Materi 8 Wireless Network PDF">
            </iframe>
        </div>
    </main>

    <!-- Tombol Floating To Top -->
    <button onclick="scrollToTop()" id="btnToTop" class="btn btn-orange" title="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <small>&copy; 2026 Yana Permana - Jaringan Komputer</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script Navigasi Back & To Top -->
    <script>
        // Fungsi kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "https://yanapermana.github.io";
            }
        }

        // Menampilkan tombol "To Top" saat halaman di-scroll ke bawah
        const btnToTop = document.getElementById("btnToTop");
        window.onscroll = function() {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                btnToTop.style.display = "flex";
            } else {
                btnToTop.style.display = "none";
            }
        };

        // Fungsi scroll halus ke paling atas
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    </script>
</body>
</html>
