<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Perancangan Jaringan Internet</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #2b2b2b;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --orange-soft: #fff7ed;
      --mist: #fffdfa;
      --line: #f1e4d6;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--mist);
      color: var(--ink);
    }
    .navbar { background: var(--orange); }
    .navbar-brand { font-weight: 700; letter-spacing: .02em; color: #fff; }
    .navbar-brand:hover { color: #fff7ed; }
    .navbar .nav-link { color: #fff4e8; }
    .navbar .nav-link:hover,
    .navbar .nav-link:focus { color: #fff; }

    .page-title {
      font-weight: 700;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      line-height: 1.2;
      color: var(--orange-dark);
    }
    .video-frame {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: .5rem;
      overflow: hidden;
      box-shadow: 0 .5rem 1.5rem rgba(249, 115, 22, .12);
    }
    .btn-sea {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }
    .btn-sea:hover, .btn-sea:focus {
      background: var(--orange-dark);
      border-color: var(--orange-dark);
      color: #fff;
    }
    .btn-outline-dark {
      color: var(--orange-dark);
      border-color: var(--orange-dark);
    }
    .btn-outline-dark:hover,
    .btn-outline-dark:focus {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }
    h2.h5 {
      color: var(--orange-dark);
      font-weight: 600;
    }
    #toTop {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      display: none;
      z-index: 1030;
    }
    footer {
      border-top: 1px solid var(--line);
      background: var(--orange-soft);
      color: #9a6b4a;
    }
  </style>
</head>
<body>

  <!-- Navigasi -->
  <nav class="navbar navbar-expand-md navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="https://yanapermana.github.io">Yana Permana</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuUtama" aria-controls="menuUtama"
              aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Konten -->
  <main class="container py-4 py-md-5" id="top">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
      <h1 class="page-title mb-0">Project Perancangan Jaringan Internet</h1>
      <button type="button" class="btn btn-outline-dark" onclick="goBack()">
        <i class="bi bi-arrow-left"></i> Kembali
      </button>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <h2 class="h5 mb-3">Video 1</h2>
        <div class="video-frame ratio ratio-16x9">
          <iframe
            src="https://www.youtube.com/embed/aV1cr2Sw6So"
            title="Project Perancangan Jaringan Internet - Video 1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small">
    &copy; <span id="tahun"></span> Yana Permana
  </footer>

  <!-- Tombol ke atas -->
  <button type="button" id="toTop" class="btn btn-sea shadow" aria-label="Kembali ke atas" title="Ke atas">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("tahun").textContent = new Date().getFullYear();

    // Kembali ke halaman sebelumnya (jika tidak ada riwayat, ke Home)
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "https://yanapermana.github.io";
      }
    }

    // Tombol ke atas: muncul setelah scroll, klik untuk menggulir ke atas
    const toTop = document.getElementById("toTop");
    window.addEventListener("scroll", function () {
      toTop.style.display = window.scrollY > 200 ? "block" : "none";
    });
    toTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
