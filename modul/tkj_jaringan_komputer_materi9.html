<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaringan Komputer Materi 9</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons untuk ikon tombol Back dan To Top -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Variabel Warna Tema Oranye & Putih */
        :root {
            --primary-orange: #ff6b00;
            --dark-orange: #e05a00;
            --light-orange: #fff3eb;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Styling Navbar */
        .navbar-orange {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.2);
        }

        .navbar-orange .navbar-brand,
        .navbar-orange .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }

        .navbar-orange .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-orange .nav-link:hover {
            color: #ffe0cc !important;
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.6);
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* Styling Judul & Konten */
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
            border-bottom: 3px solid var(--primary-orange);
            display: inline-block;
            padding-bottom: 8px;
        }

        /* Container PDF Responsif */
        .pdf-container {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border: 2px solid var(--primary-orange);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            background-color: var(--light-orange);
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Styling Button Oranye */
        .btn-orange {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            background-color: #ffffff;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Floating Button To Top */
        #btnToTop {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            display: none; /* Muncul saat di-scroll */
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            align-items: center;
            justify-content: center;
        }

        footer {
            margin-top: auto;
            background-color: var(--light-orange);
            border-top: 1px solid #ffd8bd;
            color: #555555;
        }
    </style>
</head>
<body id="top">

    <!-- Menu Navigasi -->
    <nav class="navbar navbar-expand-lg navbar-orange sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://yanapermana.github.io">Yana Permana</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="container my-4 my-md-5">
        <!-- Tombol Back ke Halaman Sebelumnya -->
        <div class="mb-3">
            <button onclick="goBack()" class="btn btn-outline-orange btn-sm px-3">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </button>
        </div>

        <!-- Judul Heading 1 -->
        <div class="mb-4">
            <h1 class="page-title">Materi 9 Server</h1>
        </div>

        <!-- Embed PDF dari Google Drive -->
        <!-- Link asli diubah dari /view menjadi /preview agar dapat di-embed dengan baik -->
        <div class="pdf-container">
            <iframe 
                src="https://drive.google.com/file/d/1fhNjcbktGf9qQo58smtIbF9jLyv_Myv9/preview" 
                allow="autoplay"
                title="Materi 9 Server PDF">
            </iframe>
        </div>

        <!-- Tombol Navigasi Bawah -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <button onclick="goBack()" class="btn btn-outline-orange">
                <i class="bi bi-arrow-left me-1"></i> Halaman Sebelumnya
            </button>
            <a href="#top" class="btn btn-orange">
                <i class="bi bi-arrow-up me-1"></i> Ke Atas
            </a>
        </div>
    </main>

    <!-- Floating Button To Top -->
    <button onclick="scrollToTop()" id="btnToTop" class="btn btn-orange" title="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <small>&copy; Yana Permana - Jaringan Komputer</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script untuk Tombol Back & To Top -->
    <script>
        // Fungsi kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika halaman dibuka langsung di tab baru
                window.location.href = "https://yanapermana.github.io/modul/index.html";
            }
        }

        // Menampilkan tombol floating "To Top" saat layar di-scroll ke bawah
        const btnToTop = document.getElementById("btnToTop");
        window.onscroll = function() {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                btnToTop.style.display = "flex";
            } else {
                btnToTop.style.display = "none";
            }
        };

        // Fungsi scroll halus ke paling atas
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
