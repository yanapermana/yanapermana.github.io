<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Cyber Security Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a1a;
      --ink-2: #2b2b2b;
      --paper: #ffffff;
      --signal: #ff7a00;
      --signal-hover: #ff9433;
      --steel: #8a8a8a;
      --soft: #fff4ea;
      --border: #ffe0c2;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    h1, h2, h3, .navbar-brand { font-family: "Space Grotesk", system-ui, sans-serif; }
    .navbar { background: var(--paper); border-bottom: 2px solid var(--signal); }
    .navbar-brand { color: var(--ink); font-weight: 700; }
    .navbar-brand::before {
      content: ""; display: inline-block; width: .7rem; height: .7rem;
      background: var(--signal); margin-right: .6rem; border-radius: 2px;
    }
    .nav-link { color: var(--ink); }
    .nav-link:hover, .nav-link:focus { color: var(--signal); }
    .navbar-toggler { border-color: var(--signal); }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23ff7a00' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }
    .hero { background: var(--soft); color: var(--ink); padding: 4rem 0 5rem; border-bottom: 1px solid var(--border); }
    .hero h1 { font-weight: 700; font-size: clamp(2rem, 5vw, 3.5rem); max-width: 18ch; }
    .hero p { color: #5a5a5a; max-width: 60ch; font-size: 1.125rem; }
    .btn-signal { background: var(--signal); color: #fff; font-weight: 500; border: 0; }
    .btn-signal:hover, .btn-signal:focus { background: var(--signal-hover); color: #fff; }
    .featured { margin-top: -3rem; }
    .video-frame { background: var(--ink); border-radius: .5rem; overflow: hidden; border: 3px solid var(--ink); }
    .video-meta { padding: .75rem 0 0; }
    .video-meta h2, .video-meta h3 { font-size: 1.15rem; font-weight: 700; margin: 0; }
    .featured .video-frame { border-color: var(--signal); }
    .section-title { font-weight: 700; font-size: 1.5rem; }
    footer { background: var(--soft); color: #5a5a5a; border-top: 1px solid var(--border); }
    a:focus-visible, .btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

    /* Tombol Back & To Top */
    .floating-buttons {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      z-index: 1050;
    }
    .btn-float {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      transition: transform .2s ease, box-shadow .2s ease;
      border: none;
      cursor: pointer;
    }
    .btn-float:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }
    .btn-back {
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--signal);
    }
    .btn-back:hover {
      background: var(--soft);
      color: var(--ink);
    }
    .btn-top {
      background: var(--signal);
      color: #fff;
    }
    .btn-top:hover {
      background: var(--signal-hover);
      color: #fff;
    }
    /* Tampilkan tombol To Top setelah scroll */
    #toTopBtn {
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility .3s ease;
    }
    #toTopBtn.show {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-md sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">Yana Permana</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>Project Cyber Security Website</h1>
      <p class="mt-3">Kumpulan video pembelajaran tentang keamanan siber. Tonton langsung di halaman ini.</p>
      <a href="#utama" class="btn btn-signal btn-lg mt-3">Mulai menonton</a>
    </div>
  </header>

  <main class="container">
    <section id="utama" class="featured pb-5">
      <div class="video-frame ratio ratio-16x9 shadow">
        <iframe src="https://www.youtube-nocookie.com/embed/F1P46XXZIOI" title="Video 1" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <div class="video-meta"><h2>Video 1</h2></div>
    </section>

    <section id="koleksi" class="pb-5">
      <h2 class="section-title mb-4">Video lainnya</h2>
      <div class="row g-4">
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/OGvGrQBsq10" title="Video 2" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 2</h3></div>
        </div>
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/rLMSXfb3oEg" title="Video 3" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 3</h3></div>
        </div>
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/kHJbOfhjf9U" title="Video 4" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 4</h3></div>
        </div>
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/VMrFlTD3LCg" title="Video 5" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 5</h3></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="py-4">
    <div class="container text-center small">
      &copy; 2026 Project Cyber Security Website
    </div>
  </footer>

  <!-- Tombol Back & To Top -->
  <div class="floating-buttons">
    <button id="backBtn" class="btn-float btn-back" title="Kembali ke halaman sebelumnya" aria-label="Kembali ke halaman sebelumnya">
      ←
    </button>
    <button id="toTopBtn" class="btn-float btn-top" title="Ke atas halaman" aria-label="Ke atas halaman">
      ↑
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('backBtn').addEventListener('click', function() {
      window.history.back();
    });

    const toTopBtn = document.getElementById('toTopBtn');

    window.addEventListener('scroll', function() {
      if (window.scrollY > 300) {
        toTopBtn.classList.add('show');
      } else {
        toTopBtn.classList.remove('show');
      }
    });

    toTopBtn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
