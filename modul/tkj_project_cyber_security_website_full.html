<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Cyber Security Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #0e2a33;
      --ink-2: #16394a;
      --paper: #eef3f2;
      --signal: #ffb000;
      --steel: #9bb3bb;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    h1, h2, h3, .navbar-brand { font-family: "Space Grotesk", system-ui, sans-serif; }
    .navbar { background: var(--ink); }
    .navbar-brand { color: #fff; font-weight: 700; }
    .navbar-brand::before {
      content: ""; display: inline-block; width: .7rem; height: .7rem;
      background: var(--signal); margin-right: .6rem; border-radius: 2px;
    }
    .nav-link { color: var(--steel); }
    .nav-link:hover, .nav-link:focus { color: #fff; }
    .hero { background: var(--ink); color: #fff; padding: 4rem 0 5rem; }
    .hero h1 { font-weight: 700; font-size: clamp(2rem, 5vw, 3.5rem); max-width: 18ch; }
    .hero p { color: var(--steel); max-width: 60ch; font-size: 1.125rem; }
    .btn-signal { background: var(--signal); color: var(--ink); font-weight: 500; border: 0; }
    .btn-signal:hover, .btn-signal:focus { background: #ffc233; color: var(--ink); }
    .featured { margin-top: -3rem; }
    .video-frame { background: var(--ink); border-radius: .5rem; overflow: hidden; border: 3px solid var(--ink); }
    .video-meta { padding: .75rem 0 0; }
    .video-meta h2, .video-meta h3 { font-size: 1.15rem; font-weight: 700; margin: 0; }
    .featured .video-frame { border-color: var(--signal); }
    .section-title { font-weight: 700; font-size: 1.5rem; }
    footer { background: var(--ink); color: var(--steel); }
    a:focus-visible, .btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-md sticky-top" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="#">Cyber Security</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#utama">Video utama</a></li>
          <li class="nav-item"><a class="nav-link" href="#koleksi">Video lainnya</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>Project Cyber Security Website</h1>
      <p class="mt-3">Kumpulan video pembelajaran tentang keamanan siber. Tonton langsung di halaman ini.</p>
      <a href="#utama" class="btn btn-signal btn-lg mt-3">Mulai menonton</a>
    </div>
  </header>

  <main class="container">
    <section id="utama" class="featured pb-5">
      <div class="video-frame ratio ratio-16x9 shadow">
        <iframe src="https://www.youtube-nocookie.com/embed/F1P46XXZIOI" title="Video 1" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <div class="video-meta"><h2>Video 1</h2></div>
    </section>

    <section id="koleksi" class="pb-5">
      <h2 class="section-title mb-4">Video lainnya</h2>
      <div class="row g-4">
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/OGvGrQBsq10" title="Video 2" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 2</h3></div>
        </div>
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/rLMSXfb3oEg" title="Video 3" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 3</h3></div>
        </div>
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/kHJbOfhjf9U" title="Video 4" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 4</h3></div>
        </div>
        <div class="col-12 col-md-6">
          <div class="video-frame ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/VMrFlTD3LCg" title="Video 5" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-meta"><h3>Video 5</h3></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="py-4">
    <div class="container text-center small">
      &copy; 2026 Project Cyber Security Website
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
