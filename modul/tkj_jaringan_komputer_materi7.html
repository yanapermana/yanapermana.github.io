<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaringan Komputer Materi 7</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --primary-orange: #FF6B00;
            --hover-orange: #E05A00;
            --light-orange: #FFF4EC;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #FFFFFF;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar-custom {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.2);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #FFFFFF !important;
            font-weight: 500;
        }

        .navbar-custom .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-custom .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
        }

        /* Custom Orange Buttons */
        .btn-orange {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            border: none;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }

        .btn-orange:hover {
            background-color: var(--hover-orange);
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            background-color: #FFFFFF;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #FFFFFF;
        }

        /* Heading & Content Card */
        .header-banner {
            background-color: var(--light-orange);
            border-left: 5px solid var(--primary-orange);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .header-banner h1 {
            color: var(--primary-orange);
            font-weight: 700;
            margin: 0;
        }

        /* Responsive PDF Container */
        .pdf-container {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border: 2px solid #FFE0C8;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating To Top Button */
        #btn-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: none;
            z-index: 999;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            align-items: center;
            justify-content: center;
        }

        footer {
            margin-top: auto;
            background-color: var(--light-orange);
            border-top: 1px solid #FFE0C8;
            color: #666666;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://yanapermana.github.io">
                <i class="bi bi-hdd-network me-2"></i>Yana Permana
            </a>
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 active" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        <!-- Back Button -->
        <div class="mb-3">
            <button onclick="history.back()" class="btn btn-outline-orange btn-sm px-3 py-2">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </button>
        </div>

        <!-- Judul Materi -->
        <div class="header-banner mb-4">
            <h1 class="h2 mb-1">Materi 7 Dynamic Routing</h1>
            <p class="text-muted mb-0 small">Mata Kuliah: Jaringan Komputer</p>
        </div>

        <!-- PDF Embed Google Drive -->
        <div class="pdf-container mb-4">
            <!-- Endpoint diubah dari /view menjadi /preview agar dapat di-embed dengan baik -->
            <iframe 
                src="https://drive.google.com/file/d/18JqmrslT8s2VVzNViSM2JzK7llVWHfoV/preview" 
                allow="autoplay"
                title="Materi 7 Dynamic Routing PDF">
            </iframe>
        </div>

        <!-- Alternatif Tombol Buka di Tab Baru (Berguna untuk pengguna mobile) -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <span class="text-muted small">
                <i class="bi bi-info-circle text-warning me-1"></i> Jika dokumen tidak tampil dengan sempurna, silakan buka langsung di Google Drive.
            </span>
            <a href="https://drive.google.com/file/d/18JqmrslT8s2VVzNViSM2JzK7llVWHfoV/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn btn-orange btn-sm px-3 py-2">
                <i class="bi bi-box-arrow-up-right me-1"></i> Buka PDF di Tab Baru
            </a>
        </div>
    </main>

    <!-- Floating Button To Top -->
    <button id="btn-to-top" class="btn btn-orange" title="Kembali ke atas" aria-label="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <small>&copy; 2026 Yana Permana - Materi Jaringan Komputer</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script untuk tombol To Top -->
    <script>
        const btnToTop = document.getElementById("btn-to-top");

        window.onscroll = function () {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                btnToTop.style.display = "flex";
            } else {
                btnToTop.style.display = "none";
            }
        };

        btnToTop.addEventListener("click", function () {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    </script>
</body>
</html>
