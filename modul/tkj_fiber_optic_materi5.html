<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Optic Materi 5</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #ff6600;
            --dark-orange: #e65c00;
            --light-orange: #fff3eb;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar-orange {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 10px rgba(255, 102, 0, 0.2);
        }

        .navbar-orange .navbar-brand {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-orange .nav-link {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            transition: color 0.2s ease-in-out;
        }

        .navbar-orange .nav-link:hover,
        .navbar-orange .nav-link:focus {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 6px;
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .navbar-toggler-icon {
            filter: invert(1);
        }

        /* Heading & Content Styling */
        .page-header {
            border-left: 5px solid var(--primary-orange);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 1.85rem;
        }

        .video-card {
            background-color: #ffffff;
            border: 1px solid #ffe0cc;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }

        /* Custom Orange Buttons */
        .btn-orange {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #ffffff;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            border-color: var(--dark-orange);
            color: #ffffff;
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border-color: var(--primary-orange);
            background-color: #ffffff;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Floating To Top Button */
        #btn-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: none;
            z-index: 99;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.35);
            padding: 0;
            align-items: center;
            justify-content: center;
        }

        footer {
            margin-top: auto;
            background-color: var(--light-orange);
            border-top: 1px solid #ffd6ba;
            color: #666666;
        }
    </style>
</head>
<body id="top">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-orange sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://yanapermana.github.io">Yana Permana</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <!-- Top Action: Back Button -->
                <div class="mb-4">
                    <button type="button" onclick="goBack()" class="btn btn-outline-orange btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Sebelumnya
                    </button>
                </div>

                <!-- Heading 1 -->
                <div class="page-header">
                    <h1 class="mb-0">Materi 5 Setting Optical Line Terminal (OLT)</h1>
                </div>

                <!-- Video Section -->
                <div class="video-card">
                    <div class="ratio ratio-16x9 rounded overflow-hidden bg-dark">
                        <iframe 
                            src="https://drive.google.com/file/d/1xqPtjm85puQwVI_o_E6eZAs0sYuXFkwJ/preview" 
                            title="Materi 5 Setting Optical Line Terminal (OLT)"
                            allow="autoplay; fullscreen" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <small class="text-muted">
                            <i class="bi bi-play-circle-fill text-warning me-1"></i> Video Pembelajaran Fiber Optic
                        </small>
                        <a href="https://drive.google.com/file/d/1xqPtjm85puQwVI_o_E6eZAs0sYuXFkwJ/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-light text-secondary border">
                            <i class="bi bi-box-arrow-up-right me-1"></i> Buka di Google Drive
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Floating Button To Top -->
    <button type="button" class="btn btn-orange" id="btn-to-top" title="Kembali ke atas" aria-label="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <small>&copy; 2026 Yana Permana. All rights reserved.</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Fungsi tombol kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika halaman dibuka di tab baru tanpa riwayat sebelumnya
                window.location.href = "https://yanapermana.github.io/modul/index.html";
            }
        }

        // Kontrol tombol To Top saat halaman di-scroll
        const toTopBtn = document.getElementById("btn-to-top");

        window.onscroll = function () {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                toTopBtn.style.display = "flex";
            } else {
                toTopBtn.style.display = "none";
            }
        };

        toTopBtn.addEventListener("click", function () {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    </script>
</body>
</html>
