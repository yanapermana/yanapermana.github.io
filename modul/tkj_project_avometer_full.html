<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project AVOmeter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #1e1e1e;
      --panel: #fff8f0;
      --orange: #e05a00;
      --orange-soft: #ff8c42;
      --white: #ffffff;
    }
    html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
    body { color: var(--ink); background: var(--white); }

    /* Navbar */
    .site-nav {
      background: var(--white);
      border-bottom: 3px solid var(--orange);
      box-shadow: 0 2px 8px rgba(224, 90, 0, 0.08);
    }
    .site-nav .navbar-brand { color: var(--orange); }
    .site-nav .nav-link { color: #5a4a3a; font-weight: 500; }
    .site-nav .nav-link:hover,
    .site-nav .nav-link:focus { color: var(--orange); }

    /* Floating buttons */
    .float-btn {
      position: fixed; bottom: 1rem; z-index: 1030;
      width: 3rem; height: 3rem; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; box-shadow: 0 .25rem .75rem rgba(0,0,0,.25);
      font-size: 1.25rem; line-height: 1;
      border: none;
    }
    #btnBack { left: 1rem; background: var(--ink); color: #fff; }
    #btnBack:hover { background: #333; }
    #btnTop { right: 1rem; display: none; background: var(--orange); color: #fff; }
    #btnTop:hover { background: #c44e00; }
    #btnTop.show { display: flex; }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--white) 0%, #fff3e6 100%);
      color: var(--ink);
      border-bottom: 6px solid var(--orange);
      padding: 4rem 0;
    }
    .hero h1 { font-weight: 800; letter-spacing: -0.02em; color: var(--orange); }
    .hero p { color: #6b5a4a; max-width: 40rem; font-size: 1.15rem; }

    /* Section titles */
    .section-title {
      font-weight: 700;
      border-left: 6px solid var(--orange);
      padding-left: .75rem;
      color: var(--ink);
    }

    /* Media cards */
    .media-card {
      background: var(--white);
      border: 2px solid #ffe0c2;
      border-radius: .75rem;
      transition: box-shadow 0.2s ease;
    }
    .media-card:hover { box-shadow: 0 4px 18px rgba(224, 90, 0, 0.12); }

    /* Buttons */
    .btn-orange {
      background: var(--orange);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    .btn-orange:hover { background: #c44e00; color: #fff; }

    /* Footer */
    footer {
      background: var(--panel);
      color: #7a6a5a;
      border-top: 3px solid var(--orange);
    }

    /* Responsive adjustments */
    @media (max-width: 576px) {
      .hero { padding: 2.5rem 0; }
      .hero h1 { font-size: 2rem; }
      .hero p { font-size: 1rem; }
    }
  </style>
</head>
<body id="top">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md sticky-top site-nav" data-bs-theme="light">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#top">Yana Permana</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuUtama" aria-controls="menuUtama"
              aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="container">
      <h1 class="display-4 mb-3">Project AVOmeter</h1>
      <p class="mb-0">Dokumen proyek dan video demonstrasi AVOmeter.</p>
    </div>
  </header>

  <!-- Main content -->
  <main class="container my-5">

    <!-- PDF Document -->
    <section class="mb-5" id="dokumen">
      <h2 class="section-title h3 mb-3">Dokumen Proyek</h2>
      <div class="media-card p-2 p-md-3">
        <div class="ratio ratio-4x3">
          <iframe
            src="https://drive.google.com/file/d/1f8OYPDfczQ6vs5bhgTJVE1neSBENYGGr/preview"
            title="Dokumen PDF Project AVOmeter"
            allow="autoplay"
            loading="lazy"></iframe>
        </div>
        <div class="text-end mt-3">
          <a class="btn btn-orange btn-sm"
             href="https://drive.google.com/file/d/1f8OYPDfczQ6vs5bhgTJVE1neSBENYGGr/view"
             target="_blank" rel="noopener">Buka di Google Drive</a>
        </div>
      </div>
    </section>

    <!-- Video Section -->
    <section id="video">
      <h2 class="section-title h3 mb-3">Video</h2>
      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <div class="media-card p-2 p-md-3 h-100">
            <h3 class="h5 mb-3">Video 1</h3>
            <div class="ratio ratio-16x9">
              <iframe
                src="https://www.youtube.com/embed/RoBE7fLJ_CQ"
                title="Video 1 Project AVOmeter"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"></iframe>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="media-card p-2 p-md-3 h-100">
            <h3 class="h5 mb-3">Video 2</h3>
            <div class="ratio ratio-16x9">
              <iframe
                src="https://www.youtube.com/embed/2w5DpH4CpKo"
                title="Video 2 Project AVOmeter"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="py-4 text-center">
    <div class="container small">&copy; 2026 Project AVOmeter</div>
  </footer>

  <!-- Floating buttons -->
  <button type="button" id="btnBack" class="btn float-btn" aria-label="Kembali ke halaman sebelumnya" title="Kembali">&larr;</button>
  <button type="button" id="btnTop" class="btn float-btn" aria-label="Ke bagian atas" title="Ke atas">&uarr;</button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('btnBack').addEventListener('click', function () {
      if (history.length > 1) { history.back(); }
      else { window.location.href = 'https://yanapermana.github.io'; }
    });

    var btnTop = document.getElementById('btnTop');
    window.addEventListener('scroll', function () {
      btnTop.classList.toggle('show', window.scrollY > 300);
    }, { passive: true });

    btnTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
