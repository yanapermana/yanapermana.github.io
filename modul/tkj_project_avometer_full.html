<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project AVOmeter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #14232b;
      --panel: #f3f6f7;
      --teal: #0f6b73;
      --needle: #d8432b;
    }
    body { color: var(--ink); background: #fff; }
    .hero {
      background: var(--ink);
      color: #fff;
      border-bottom: 6px solid var(--needle);
    }
    .hero h1 { font-weight: 800; letter-spacing: -0.02em; }
    .hero p { color: #b9c7cc; max-width: 40rem; }
    .section-title { font-weight: 700; border-left: 6px solid var(--teal); padding-left: .75rem; }
    .media-card { background: var(--panel); border: 1px solid #d5dee1; border-radius: .5rem; }
    .btn-teal { background: var(--teal); color: #fff; }
    .btn-teal:hover { background: #0b535a; color: #fff; }
    footer { background: var(--panel); color: #5a6b72; }
  </style>
</head>
<body>

  <header class="hero py-5">
    <div class="container py-3">
      <h1 class="display-4 mb-3">Project AVOmeter</h1>
      <p class="fs-5 mb-0">Dokumen proyek dan video demonstrasi AVOmeter.</p>
    </div>
  </header>

  <main class="container my-5">

    <!-- PDF -->
    <section class="mb-5" id="dokumen">
      <h2 class="section-title h3 mb-3">Dokumen Proyek</h2>
      <div class="media-card p-2 p-md-3">
        <div class="ratio ratio-4x3">
          <iframe
            src="https://drive.google.com/file/d/1f8OYPDfczQ6vs5bhgTJVE1neSBENYGGr/preview"
            title="Dokumen PDF Project AVOmeter"
            allow="autoplay"
            loading="lazy"></iframe>
        </div>
        <div class="text-end mt-3">
          <a class="btn btn-teal btn-sm"
             href="https://drive.google.com/file/d/1f8OYPDfczQ6vs5bhgTJVE1neSBENYGGr/view"
             target="_blank" rel="noopener">Buka di Google Drive</a>
        </div>
      </div>
    </section>

    <!-- Video -->
    <section id="video">
      <h2 class="section-title h3 mb-3">Video</h2>
      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <div class="media-card p-2 p-md-3 h-100">
            <h3 class="h5 mb-3">Video 1</h3>
            <div class="ratio ratio-16x9">
              <iframe
                src="https://www.youtube.com/embed/RoBE7fLJ_CQ"
                title="Video 1 Project AVOmeter"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"></iframe>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="media-card p-2 p-md-3 h-100">
            <h3 class="h5 mb-3">Video 2</h3>
            <div class="ratio ratio-16x9">
              <iframe
                src="https://www.youtube.com/embed/2w5DpH4CpKo"
                title="Video 2 Project AVOmeter"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="py-4 text-center">
    <div class="container small">&copy; 2026 Project AVOmeter</div>
  </footer>

</body>
</html>
