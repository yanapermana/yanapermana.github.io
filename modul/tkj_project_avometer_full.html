<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project AVOmeter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #14232b;
      --panel: #f3f6f7;
      --teal: #0f6b73;
      --needle: #d8432b;
    }
    html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
    body { color: var(--ink); background: #fff; }
    .site-nav { background: var(--ink); border-bottom: 1px solid #263a44; }
    .site-nav .nav-link { color: #b9c7cc; }
    .site-nav .nav-link:hover, .site-nav .nav-link:focus { color: #fff; }
    .float-btn {
      position: fixed; bottom: 1rem; z-index: 1030;
      width: 3rem; height: 3rem; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; box-shadow: 0 .25rem .75rem rgba(0,0,0,.25);
      font-size: 1.25rem; line-height: 1;
    }
    #btnBack { left: 1rem; }
    #btnTop { right: 1rem; display: none; }
    #btnTop.show { display: flex; }
    .hero {
      background: var(--ink);
      color: #fff;
      border-bottom: 6px solid var(--needle);
    }
    .hero h1 { font-weight: 800; letter-spacing: -0.02em; }
    .hero p { color: #b9c7cc; max-width: 40rem; }
    .section-title { font-weight: 700; border-left: 6px solid var(--teal); padding-left: .75rem; }
    .media-card { background: var(--panel); border: 1px solid #d5dee1; border-radius: .5rem; }
    .btn-teal { background: var(--teal); color: #fff; }
    .btn-teal:hover { background: #0b535a; color: #fff; }
    footer { background: var(--panel); color: #5a6b72; }
  </style>
</head>
<body id="top">

  <nav class="navbar navbar-expand-md sticky-top site-nav" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#top">Project AVOmeter</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuUtama" aria-controls="menuUtama"
              aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io">Yana Permana</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero py-5">
    <div class="container py-3">
      <h1 class="display-4 mb-3">Project AVOmeter</h1>
      <p class="fs-5 mb-0">Dokumen proyek dan video demonstrasi AVOmeter.</p>
    </div>
  </header>

  <main class="container my-5">

    <!-- PDF -->
    <section class="mb-5" id="dokumen">
      <h2 class="section-title h3 mb-3">Dokumen Proyek</h2>
      <div class="media-card p-2 p-md-3">
        <div class="ratio ratio-4x3">
          <iframe
            src="https://drive.google.com/file/d/1f8OYPDfczQ6vs5bhgTJVE1neSBENYGGr/preview"
            title="Dokumen PDF Project AVOmeter"
            allow="autoplay"
            loading="lazy"></iframe>
        </div>
        <div class="text-end mt-3">
          <a class="btn btn-teal btn-sm"
             href="https://drive.google.com/file/d/1f8OYPDfczQ6vs5bhgTJVE1neSBENYGGr/view"
             target="_blank" rel="noopener">Buka di Google Drive</a>
        </div>
      </div>
    </section>

    <!-- Video -->
    <section id="video">
      <h2 class="section-title h3 mb-3">Video</h2>
      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <div class="media-card p-2 p-md-3 h-100">
            <h3 class="h5 mb-3">Video 1</h3>
            <div class="ratio ratio-16x9">
              <iframe
                src="https://www.youtube.com/embed/RoBE7fLJ_CQ"
                title="Video 1 Project AVOmeter"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"></iframe>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="media-card p-2 p-md-3 h-100">
            <h3 class="h5 mb-3">Video 2</h3>
            <div class="ratio ratio-16x9">
              <iframe
                src="https://www.youtube.com/embed/2w5DpH4CpKo"
                title="Video 2 Project AVOmeter"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="py-4 text-center">
    <div class="container small">&copy; 2026 Project AVOmeter</div>
  </footer>

  <button type="button" id="btnBack" class="btn btn-dark float-btn" aria-label="Kembali ke halaman sebelumnya" title="Kembali">&larr;</button>
  <button type="button" id="btnTop" class="btn btn-teal float-btn" aria-label="Ke bagian atas" title="Ke atas">&uarr;</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('btnBack').addEventListener('click', function () {
      if (history.length > 1) { history.back(); }
      else { window.location.href = 'https://yanapermana.github.io'; }
    });
    var btnTop = document.getElementById('btnTop');
    window.addEventListener('scroll', function () {
      btnTop.classList.toggle('show', window.scrollY > 300);
    }, { passive: true });
    btnTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
