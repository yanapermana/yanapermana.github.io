<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Cyber Security Wifi</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons untuk tombol back/top -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg: #ffffff;
      --surface: #fff9f0;
      --surface-hover: #fff2e0;
      --line: #ffd9a8;
      --accent: #f57c00;
      --accent-hover: #e66a00;
      --accent-light: #ffb74d;
      --muted: #6e5b4b;
      --text-dark: #2d2419;
      --text-light: #ffffff;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      position: relative;
      min-height: 100vh;
    }
    .navbar { 
      background: rgba(255, 255, 255, .95); 
      border-bottom: 1px solid var(--line); 
      backdrop-filter: blur(6px);
    }
    .navbar-brand { 
      font-weight: 700; 
      letter-spacing: .2px; 
      color: var(--accent) !important;
    }
    .brand-dot { color: var(--accent-light); }
    .navbar .nav-link {
      color: var(--text-dark);
      font-weight: 500;
      transition: color .2s;
    }
    .navbar .nav-link:hover,
    .navbar .nav-link:focus-visible {
      color: var(--accent);
    }
    .navbar-toggler {
      border-color: var(--line);
    }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23f57c00' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }
    .hero { 
      padding: 4rem 0 2.5rem; 
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, #fff9f0 0%, #ffffff 100%);
    }
    .hero h1 { 
      font-weight: 700; 
      font-size: clamp(2rem, 5vw, 3.25rem); 
      line-height: 1.15;
      color: var(--text-dark);
    }
    .hero h1 .highlight {
      color: var(--accent);
    }
    .hero p { 
      color: var(--muted); 
      max-width: 60ch; 
    }
    .video-card { 
      background: var(--surface); 
      border: 1px solid var(--line); 
      border-radius: .5rem; 
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(245, 124, 0, .12);
    }
    .video-card .card-body { padding: .85rem 1rem; }
    .video-card .card-title { 
      font-size: 1rem; 
      font-weight: 600; 
      margin: 0;
      color: var(--text-dark);
    }
    .video-card a { 
      color: var(--accent); 
      text-decoration: none; 
      font-size: .875rem;
      font-weight: 500;
      transition: color .2s;
    }
    .video-card a:hover, .video-card a:focus-visible { 
      text-decoration: underline;
      color: var(--accent-hover);
    }
    a:focus-visible, .navbar-toggler:focus-visible { 
      outline: 2px solid var(--accent); 
      outline-offset: 2px; 
    }
    footer { 
      border-top: 1px solid var(--line); 
      color: var(--muted);
      background: var(--surface);
    }

    /* Tombol back dan to top */
    .floating-buttons {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      z-index: 1050;
    }
    .btn-float {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(245, 124, 0, .25);
      font-size: 1.35rem;
      line-height: 1;
      transition: transform .15s ease, background .2s, box-shadow .2s;
    }
    .btn-float:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 16px rgba(245, 124, 0, .35);
    }
    .btn-top { 
      background: var(--accent); 
      color: var(--text-light); 
      border: none; 
    }
    .btn-top:hover { 
      background: var(--accent-hover); 
      color: var(--text-light); 
    }
    .btn-back { 
      background: var(--text-light); 
      color: var(--accent); 
      border: 1.5px solid var(--accent); 
    }
    .btn-back:hover { 
      background: var(--surface); 
      color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Responsive spacing untuk mobile */
    @media (max-width: 576px) {
      .hero { padding: 2.5rem 0 1.75rem; }
      .floating-buttons { bottom: 1rem; right: 1rem; }
      .btn-float { width: 42px; height: 42px; font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">Yana Permana<span class="brand-dot">.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io" target="_blank" rel="noopener">
              <i class="bi bi-person-circle me-1"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io/jadwal.html" target="_blank" rel="noopener">
              <i class="bi bi-calendar3 me-1"></i>Jadwal
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io/modul/index.html" target="_blank" rel="noopener">
              <i class="bi bi-journal-code me-1"></i>Modul
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ========== HERO ========== -->
  <header class="hero">
    <div class="container">
      <h1>Project <span class="highlight">Cyber Security</span> Wifi</h1>
      <p class="mt-3 mb-0 fs-5">Kumpulan 10 video yang membahas keamanan jaringan Wi-Fi. Tonton satu per satu, langsung dari halaman ini.</p>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container py-5">
    <div id="video-grid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="py-4">
    <div class="container text-center small">
      &copy; <span id="year"></span> Project Cyber Security Wifi
    </div>
  </footer>

  <!-- ========== FLOATING BUTTONS (BACK & TO TOP) ========== -->
  <div class="floating-buttons">
    <button type="button" id="backBtn" class="btn btn-float btn-back" title="Kembali ke halaman sebelumnya" aria-label="Kembali ke halaman sebelumnya">
      <i class="bi bi-arrow-left"></i>
    </button>
    <button type="button" id="topBtn" class="btn btn-float btn-top" title="Kembali ke atas" aria-label="Kembali ke atas" style="display:none;">
      <i class="bi bi-arrow-up"></i>
    </button>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ---------- Data video ---------- */
    const videoIds = [
      "Mqlhwx2mJ1w", "8faBCI287J8", "enNJZ42mYQY", "t8NS4u6TG30", "w9Rx3iE4HFk",
      "AbHnEg2noSI", "GJ16HSyIFEM", "_MLEzMOepIY", "NgssC_xsq4M", "3GP2PXAZLCE"
    ];

    /* ---------- Render kartu video ---------- */
    document.getElementById("video-grid").innerHTML = videoIds.map((id, i) => `
      <div class="col">
        <article class="video-card h-100">
          <div class="ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/${id}"
                    title="Video ${i + 1} - Project Cyber Security Wifi"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
          </div>
          <div class="card-body d-flex justify-content-between align-items-center">
            <h2 class="card-title">Video ${i + 1}</h2>
            <a href="https://youtu.be/${id}" target="_blank" rel="noopener">Buka di YouTube</a>
          </div>
        </article>
      </div>`).join("");

    /* ---------- Tahun di footer ---------- */
    document.getElementById("year").textContent = new Date().getFullYear();

    /* ---------- Tombol Back ---------- */
    document.getElementById("backBtn").addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "https://yanapermana.github.io";
      }
    });

    /* ---------- Tombol To Top (muncul setelah scroll) ---------- */
    const topBtn = document.getElementById("topBtn");

    function toggleTopButton() {
      if (window.scrollY > 300) {
        topBtn.style.display = "flex";
      } else {
        topBtn.style.display = "none";
      }
    }

    window.addEventListener("scroll", toggleTopButton, { passive: true });

    topBtn.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* Panggil sekali saat load untuk kondisi awal */
    toggleTopButton();
  </script>
</body>
</html>
