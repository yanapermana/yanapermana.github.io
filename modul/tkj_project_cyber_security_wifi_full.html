<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Cyber Security Wifi</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons untuk tombol back/top -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg: #0e1a24;
      --surface: #16283a;
      --line: #27425c;
      --accent: #f2b84b;
      --muted: #9db2c6;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: #e8eef4;
      position: relative;
      min-height: 100vh;
    }
    .navbar { background: rgba(14, 26, 36, .95); border-bottom: 1px solid var(--line); }
    .navbar-brand { font-weight: 700; letter-spacing: .2px; }
    .brand-dot { color: var(--accent); }
    .navbar .nav-link {
      color: #e8eef4;
      font-weight: 500;
      transition: color .2s;
    }
    .navbar .nav-link:hover,
    .navbar .nav-link:focus-visible {
      color: var(--accent);
    }
    .hero { padding: 4rem 0 2.5rem; border-bottom: 1px solid var(--line); }
    .hero h1 { font-weight: 700; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.15; }
    .hero p { color: var(--muted); max-width: 60ch; }
    .video-card { background: var(--surface); border: 1px solid var(--line); border-radius: .5rem; overflow: hidden; }
    .video-card .card-body { padding: .85rem 1rem; }
    .video-card .card-title { font-size: 1rem; font-weight: 600; margin: 0; }
    .video-card a { color: var(--accent); text-decoration: none; font-size: .875rem; }
    .video-card a:hover, .video-card a:focus-visible { text-decoration: underline; }
    a:focus-visible, .navbar-toggler:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { border-top: 1px solid var(--line); color: var(--muted); }

    /* Tombol back dan to top */
    .floating-buttons {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      z-index: 1050;
    }
    .btn-float {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
      font-size: 1.35rem;
      line-height: 1;
      transition: transform .15s ease, background .2s;
    }
    .btn-float:hover { transform: translateY(-2px); }
    .btn-top { background: var(--accent); color: #0e1a24; border: none; }
    .btn-top:hover { background: #f7c96b; color: #0e1a24; }
    .btn-back { background: var(--surface); color: #e8eef4; border: 1px solid var(--line); }
    .btn-back:hover { background: #1f3549; color: #fff; }

    /* Responsive spacing untuk mobile */
    @media (max-width: 576px) {
      .hero { padding: 2.5rem 0 1.75rem; }
      .floating-buttons { bottom: 1rem; right: 1rem; }
      .btn-float { width: 42px; height: 42px; font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">Project Cyber Security Wifi<span class="brand-dot">.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io" target="_blank" rel="noopener">
              <i class="bi bi-person-circle me-1"></i>Yana Permana
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io/jadwal.html" target="_blank" rel="noopener">
              <i class="bi bi-calendar3 me-1"></i>Jadwal
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io/modul/index.html" target="_blank" rel="noopener">
              <i class="bi bi-journal-code me-1"></i>Modul
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ========== HERO ========== -->
  <header class="hero">
    <div class="container">
      <h1>Project Cyber Security Wifi</h1>
      <p class="mt-3 mb-0 fs-5">Kumpulan 10 video yang membahas keamanan jaringan Wi-Fi. Tonton satu per satu, langsung dari halaman ini.</p>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container py-5">
    <div id="video-grid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="py-4">
    <div class="container text-center small">
      &copy; <span id="year"></span> Project Cyber Security Wifi
    </div>
  </footer>

  <!-- ========== FLOATING BUTTONS (BACK & TO TOP) ========== -->
  <div class="floating-buttons">
    <button type="button" id="backBtn" class="btn btn-float btn-back" title="Kembali ke halaman sebelumnya" aria-label="Kembali ke halaman sebelumnya">
      <i class="bi bi-arrow-left"></i>
    </button>
    <button type="button" id="topBtn" class="btn btn-float btn-top" title="Kembali ke atas" aria-label="Kembali ke atas" style="display:none;">
      <i class="bi bi-arrow-up"></i>
    </button>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ---------- Data video ---------- */
    const videoIds = [
      "Mqlhwx2mJ1w", "8faBCI287J8", "enNJZ42mYQY", "t8NS4u6TG30", "w9Rx3iE4HFk",
      "AbHnEg2noSI", "GJ16HSyIFEM", "_MLEzMOepIY", "NgssC_xsq4M", "3GP2PXAZLCE"
    ];

    /* ---------- Render kartu video ---------- */
    document.getElementById("video-grid").innerHTML = videoIds.map((id, i) => `
      <div class="col">
        <article class="video-card h-100">
          <div class="ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/${id}"
                    title="Video ${i + 1} - Project Cyber Security Wifi"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
          </div>
          <div class="card-body d-flex justify-content-between align-items-center">
            <h2 class="card-title">Video ${i + 1}</h2>
            <a href="https://youtu.be/${id}" target="_blank" rel="noopener">Buka di YouTube</a>
          </div>
        </article>
      </div>`).join("");

    /* ---------- Tahun di footer ---------- */
    document.getElementById("year").textContent = new Date().getFullYear();

    /* ---------- Tombol Back ---------- */
    document.getElementById("backBtn").addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // Fallback jika tidak ada riwayat (misal dibuka langsung)
        window.location.href = "https://yanapermana.github.io";
      }
    });

    /* ---------- Tombol To Top (muncul setelah scroll) ---------- */
    const topBtn = document.getElementById("topBtn");

    function toggleTopButton() {
      if (window.scrollY > 300) {
        topBtn.style.display = "flex";
      } else {
        topBtn.style.display = "none";
      }
    }

    window.addEventListener("scroll", toggleTopButton, { passive: true });

    topBtn.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* Panggil sekali saat load untuk kondisi awal */
    toggleTopButton();
  </script>
</body>
</html>
