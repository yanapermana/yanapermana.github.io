<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Cyber Security Wifi</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e1a24;
      --surface: #16283a;
      --line: #27425c;
      --accent: #f2b84b;
      --muted: #9db2c6;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: #e8eef4;
    }
    .navbar { background: rgba(14, 26, 36, .95); border-bottom: 1px solid var(--line); }
    .navbar-brand { font-weight: 700; letter-spacing: .2px; }
    .brand-dot { color: var(--accent); }
    .hero { padding: 4rem 0 2.5rem; border-bottom: 1px solid var(--line); }
    .hero h1 { font-weight: 700; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.15; }
    .hero p { color: var(--muted); max-width: 60ch; }
    .video-card { background: var(--surface); border: 1px solid var(--line); border-radius: .5rem; overflow: hidden; }
    .video-card .card-body { padding: .85rem 1rem; }
    .video-card .card-title { font-size: 1rem; font-weight: 600; margin: 0; }
    .video-card a { color: var(--accent); text-decoration: none; font-size: .875rem; }
    .video-card a:hover, .video-card a:focus-visible { text-decoration: underline; }
    a:focus-visible, .navbar-toggler:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { border-top: 1px solid var(--line); color: var(--muted); }
  </style>
</head>
<body>

  <nav class="navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">Project Cyber Security Wifi<span class="brand-dot">.</span></a>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>Project Cyber Security Wifi</h1>
      <p class="mt-3 mb-0 fs-5">Kumpulan 10 video yang membahas keamanan jaringan Wi-Fi. Tonton satu per satu, langsung dari halaman ini.</p>
    </div>
  </header>

  <main class="container py-5">
    <div id="video-grid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>
  </main>

  <footer class="py-4">
    <div class="container text-center small">
      &copy; <span id="year"></span> Project Cyber Security Wifi
    </div>
  </footer>

  <script>
    const videoIds = [
      "Mqlhwx2mJ1w", "8faBCI287J8", "enNJZ42mYQY", "t8NS4u6TG30", "w9Rx3iE4HFk",
      "AbHnEg2noSI", "GJ16HSyIFEM", "_MLEzMOepIY", "NgssC_xsq4M", "3GP2PXAZLCE"
    ];

    document.getElementById("video-grid").innerHTML = videoIds.map((id, i) => `
      <div class="col">
        <article class="video-card h-100">
          <div class="ratio ratio-16x9">
            <iframe src="https://www.youtube-nocookie.com/embed/${id}"
                    title="Video ${i + 1} - Project Cyber Security Wifi"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
          </div>
          <div class="card-body d-flex justify-content-between align-items-center">
            <h2 class="card-title">Video ${i + 1}</h2>
            <a href="https://youtu.be/${id}" target="_blank" rel="noopener">Buka di YouTube</a>
          </div>
        </article>
      </div>`).join("");

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
