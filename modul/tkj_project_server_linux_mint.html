<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Server Linux Mint</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font untuk kesan modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange-primary: #e65c00;
      --orange-soft: #ff8c42;
      --orange-light: #fff2e6;
      --orange-deep: #c44b00;
    }

    * {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    html { 
      scroll-behavior: smooth; 
    }

    body {
      background-color: #fefcf9;
      color: #1e1e1e;
    }

    /* ——— Navbar ——— */
    .navbar {
      background: linear-gradient(135deg, #e65c00 0%, #f57c1f 100%) !important;
      box-shadow: 0 6px 18px rgba(230, 92, 0, 0.18);
      padding: 0.9rem 0;
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff !important;
      font-size: 1.35rem;
    }

    .navbar-brand:hover {
      color: #fff2e6 !important;
    }

    .navbar-nav .nav-link {
      color: rgba(255, 255, 255, 0.88) !important;
      font-weight: 500;
      padding: 0.5rem 1rem !important;
      border-radius: 40px;
      transition: all 0.18s ease;
      font-size: 0.95rem;
    }

    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link:focus {
      background-color: rgba(255, 255, 255, 0.18);
      color: #ffffff !important;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.4);
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 0.9)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ——— Card Utama ——— */
    .card {
      border: none;
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(230, 92, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.25s ease;
    }

    .card:hover {
      box-shadow: 0 18px 40px rgba(230, 92, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.03);
    }

    .card-header {
      background-color: #ffffff;
      border-bottom: 1px solid rgba(230, 92, 0, 0.15);
      padding: 1.25rem 1.75rem;
    }

    .card-header h1 {
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.3px;
      color: #2d2d2d;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-header h1::before {
      content: "📄";
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 2px rgba(230, 92, 0, 0.2));
    }

    /* ——— Tombol Utama (orange) ——— */
    .btn-success {
      background-color: var(--orange-primary) !important;
      border: none !important;
      font-weight: 600;
      letter-spacing: 0.2px;
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(230, 92, 0, 0.25);
      transition: all 0.18s ease;
      color: #ffffff !important;
    }

    .btn-success:hover,
    .btn-success:focus {
      background-color: var(--orange-deep) !important;
      box-shadow: 0 8px 18px rgba(230, 92, 0, 0.4);
      transform: translateY(-1px);
    }

    .btn-success:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(230, 92, 0, 0.3);
    }

    /* ——— Tombol Outline (orange) ——— */
    .btn-outline-success {
      border: 2px solid var(--orange-primary) !important;
      color: var(--orange-primary) !important;
      background-color: #ffffff !important;
      font-weight: 600;
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      transition: all 0.18s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .btn-outline-success:hover,
    .btn-outline-success:focus {
      background-color: var(--orange-primary) !important;
      color: #ffffff !important;
      border-color: var(--orange-primary) !important;
      box-shadow: 0 8px 18px rgba(230, 92, 0, 0.25);
      transform: translateY(-1px);
    }

    .btn-outline-success:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(230, 92, 0, 0.15);
    }

    /* ——— Floating Actions ——— */
    .floating-actions .btn {
      font-size: 0.9rem;
      padding: 0.7rem 1.4rem;
      border-radius: 50px;
      backdrop-filter: blur(2px);
    }

    #btnTop {
      display: none;
    }

    /* ——— PDF Wrapper ——— */
    .pdf-wrapper {
      position: relative;
      width: 100%;
      height: 80vh;
      min-height: 480px;
      background-color: #fff7f0; /* orange sangat lembut sebagai background iframe */
    }

    .pdf-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ——— Footer ——— */
    footer {
      color: #7a4a2e !important;
      border-top: 1px solid rgba(230, 92, 0, 0.15) !important;
      background-color: #fffcf9;
      font-weight: 500;
      letter-spacing: 0.2px;
      margin-top: 2rem;
    }

    /* ——— Latar belakang body dan elemen pendukung ——— */
    .bg-body-tertiary {
      background-color: #fefcf9 !important;
    }

    /* Efek aksen garis orange di bawah header card */
    .card-header::after {
      content: '';
      display: block;
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, var(--orange-primary), var(--orange-soft), transparent);
      margin-top: 1.1rem;
      border-radius: 4px;
    }

    /* Penyesuaian responsif */
    @media (max-width: 576px) {
      .card-header {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 0.8rem !important;
        padding: 1.1rem 1.2rem;
      }
      .card-header h1 {
        font-size: 1.25rem;
      }
      .btn-success {
        width: 100%;
        text-align: center;
      }
      .floating-actions .btn {
        font-size: 0.8rem;
        padding: 0.6rem 1.1rem;
      }
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100" id="top">

  <!-- Navbar dengan tema orange gradient -->
  <nav class="navbar navbar-expand-md navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#top">Project Server Linux Mint</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuUtama" aria-controls="menuUtama"
              aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io">Yana Permana</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card">
          <div class="card-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
            <h1 class="h5 mb-0">Dokumen Project</h1>
            <a class="btn btn-success btn-sm"
               href="https://drive.google.com/file/d/1BW3UW3NrIVqT2P4hHi-MDzJ11WYq7HJH/view?usp=drive_link"
               target="_blank" rel="noopener">
               Buka di Google Drive
            </a>
          </div>
          <div class="card-body p-0">
            <div class="pdf-wrapper">
              <iframe
                src="https://drive.google.com/file/d/1BW3UW3NrIVqT2P4hHi-MDzJ11WYq7HJH/preview"
                title="Project Server Linux Mint (PDF)"
                allow="autoplay"
                allowfullscreen></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer dengan nuansa orange lembut -->
  <footer class="text-center small py-3">
    &copy; Project Server Linux Mint
  </footer>

  <!-- Floating action buttons -->
  <div class="floating-actions d-flex flex-column gap-2">
    <button type="button" id="btnTop" class="btn btn-success shadow" aria-label="Ke bagian atas">&uarr; Ke Atas</button>
    <button type="button" id="btnBack" class="btn btn-outline-success bg-white shadow" aria-label="Kembali ke halaman sebelumnya">&larr; Kembali</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Kembali ke halaman sebelumnya (fallback ke beranda jika tidak ada riwayat)
    document.getElementById('btnBack').addEventListener('click', function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'https://yanapermana.github.io';
      }
    });

    // Ke bagian atas halaman
    var btnTop = document.getElementById('btnTop');
    btnTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Tampilkan tombol "Ke Atas" setelah scroll
    window.addEventListener('scroll', function () {
      btnTop.style.display = window.scrollY > 200 ? 'block' : 'none';
    });

    // Tema orange tetap konsisten, tombol back tetap outline dengan border orange
  </script>
</body>
</html>
