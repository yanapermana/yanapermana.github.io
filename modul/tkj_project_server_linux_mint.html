<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Server Linux Mint</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    .pdf-wrapper { position: relative; width: 100%; height: 80vh; min-height: 480px; }
    .pdf-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .floating-actions {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 1030;
    }
    #btnTop { display: none; }
  </style>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" id="top">

  <nav class="navbar navbar-expand-md navbar-dark bg-success shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#top">Project Server Linux Mint</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuUtama" aria-controls="menuUtama"
              aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io">Yana Permana</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card shadow-sm">
          <div class="card-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
            <h1 class="h5 mb-0">Dokumen Project</h1>
            <a class="btn btn-success btn-sm"
               href="https://drive.google.com/file/d/1BW3UW3NrIVqT2P4hHi-MDzJ11WYq7HJH/view?usp=drive_link"
               target="_blank" rel="noopener">Buka di Google Drive</a>
          </div>
          <div class="card-body p-0">
            <div class="pdf-wrapper">
              <iframe
                src="https://drive.google.com/file/d/1BW3UW3NrIVqT2P4hHi-MDzJ11WYq7HJH/preview"
                title="Project Server Linux Mint (PDF)"
                allow="autoplay"
                allowfullscreen></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-body-secondary small py-3 border-top">
    &copy; Project Server Linux Mint
  </footer>

  <div class="floating-actions d-flex flex-column gap-2">
    <button type="button" id="btnTop" class="btn btn-success shadow" aria-label="Ke bagian atas">&uarr; Ke Atas</button>
    <button type="button" id="btnBack" class="btn btn-outline-success bg-white shadow" aria-label="Kembali ke halaman sebelumnya">&larr; Kembali</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Kembali ke halaman sebelumnya (fallback ke beranda jika tidak ada riwayat)
    document.getElementById('btnBack').addEventListener('click', function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'https://yanapermana.github.io';
      }
    });

    // Ke bagian atas halaman
    var btnTop = document.getElementById('btnTop');
    btnTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Tampilkan tombol "Ke Atas" setelah scroll
    window.addEventListener('scroll', function () {
      btnTop.style.display = window.scrollY > 200 ? 'block' : 'none';
    });
  </script>
</body>
</html>
