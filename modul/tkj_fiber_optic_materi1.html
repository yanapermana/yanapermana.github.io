<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiber Optic Materi 1</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --primary-orange: #f97316;
      --dark-orange: #ea580c;
      --light-orange: #fff7ed;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #ffffff;
      color: #333333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar Styling */
    .navbar-orange {
      background-color: var(--primary-orange);
    }

    .navbar-orange .navbar-brand,
    .navbar-orange .nav-link {
      color: #ffffff;
      font-weight: 500;
    }

    .navbar-orange .nav-link:hover {
      color: #ffedd5;
    }

    /* Custom Button Orange */
    .btn-orange {
      background-color: var(--primary-orange);
      border-color: var(--primary-orange);
      color: #ffffff;
      font-weight: 500;
      transition: all 0.2s ease-in-out;
    }

    .btn-orange:hover {
      background-color: var(--dark-orange);
      border-color: var(--dark-orange);
      color: #ffffff;
    }

    .btn-outline-orange {
      color: var(--primary-orange);
      border-color: var(--primary-orange);
      background-color: #ffffff;
      font-weight: 500;
    }

    .btn-outline-orange:hover {
      background-color: var(--primary-orange);
      color: #ffffff;
    }

    /* Header Section */
    .page-header {
      background-color: var(--light-orange);
      border-bottom: 3px solid var(--primary-orange);
    }

    .text-orange {
      color: var(--primary-orange);
    }

    /* Responsive PDF Container */
    .pdf-container {
      position: relative;
      width: 100%;
      height: 80vh; /* Tinggi otomatis menyesuaikan layar */
      min-height: 500px;
      border: 2px solid var(--primary-orange);
      border-radius: 8px;
      overflow: hidden;
      background-color: #f8f9fa;
    }

    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating To-Top Button */
    #btn-to-top {
      position: fixed;
      bottom: 25px;
      right: 25px;
      display: none;
      z-index: 999;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body id="top">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-orange sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="https://yanapermana.github.io">Yana Permana</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="https://yanapermana.github.io/modul/index.html">Modul</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header & Tombol Back -->
  <header class="page-header py-4 mb-4">
    <div class="container">
      <div class="mb-3">
        <button onclick="goBack()" class="btn btn-outline-orange btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Kembali
        </button>
      </div>
      <h1 class="fw-bold text-orange mb-0">Materi 1 Infrastruktur Fiber Optic</h1>
    </div>
  </header>

  <!-- Konten Utama (Embed PDF) -->
  <main class="container mb-5 flex-grow-1">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-2 p-md-3 bg-white rounded">
        <div class="pdf-container">
          <!-- Link Google Drive diubah dari /view menjadi /preview agar bisa di-embed -->
          <iframe 
            src="https://drive.google.com/file/d/1w_I2T8ez-OydKfw5GTFDimR7TdVPo8iC/preview" 
            allow="autoplay" 
            title="Materi 1 Infrastruktur Fiber Optic">
          </iframe>
        </div>
      </div>
    </div>

    <!-- Navigasi Bawah -->
    <div class="d-flex justify-content-between align-items-center mt-4">
      <button onclick="goBack()" class="btn btn-outline-orange">
        <i class="bi bi-arrow-left me-1"></i> Halaman Sebelumnya
      </button>
      <a href="#top" class="btn btn-orange">
        <i class="bi bi-arrow-up me-1"></i> Ke Atas
      </a>
    </div>
  </main>

  <!-- Floating To Top Button (Muncul saat di-scroll) -->
  <button onclick="scrollToTop()" id="btn-to-top" class="btn btn-orange" title="Kembali ke atas">
    <i class="bi bi-arrow-up fs-5"></i>
  </button>

  <!-- Footer -->
  <footer class="py-3 text-center text-white mt-auto" style="background-color: var(--primary-orange);">
    <div class="container">
      <small>&copy; 2026 Yana Permana. All Rights Reserved.</small>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script untuk tombol Back dan To Top -->
  <script>
    // Fungsi kembali ke halaman sebelumnya
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // Fallback jika halaman dibuka langsung di tab baru
        window.location.href = "https://yanapermana.github.io/modul/index.html";
      }
    }

    // Menampilkan tombol floating "To Top" saat halaman di-scroll ke bawah
    const btnToTop = document.getElementById("btn-to-top");
    window.onscroll = function() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        btnToTop.style.display = "block";
      } else {
        btnToTop.style.display = "none";
      }
    };

    // Fungsi scroll halus ke paling atas
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
