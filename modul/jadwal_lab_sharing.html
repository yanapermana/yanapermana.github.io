<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Lab Sharing</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #f97316;
            --dark-orange: #ea580c;
            --light-orange: #fff7ed;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Tema Warna Oranye & Putih */
        .bg-orange {
            background-color: var(--primary-orange) !important;
        }

        .text-orange {
            color: var(--primary-orange) !important;
        }

        .border-orange {
            border-color: var(--primary-orange) !important;
        }

        .btn-orange {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Navbar Styling */
        .navbar-nav .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
        }

        .navbar-nav .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Kontainer PDF Responsif */
        .pdf-wrapper {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 2px solid #fed7aa;
            background-color: var(--light-orange);
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol Back to Top */
        #btn-back-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: none;
            z-index: 999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        main {
            flex: 1;
        }
    </style>
</head>
<body id="top">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-orange shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="https://yanapermana.github.io">
                <i class="bi bi-laptop me-2"></i>Yana Permana
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="container my-4 my-md-5">
        
        <!-- Baris Tombol Back -->
        <div class="mb-4">
            <button onclick="goBack()" class="btn btn-outline-orange fw-semibold shadow-sm">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Sebelumnya
            </button>
        </div>

        <!-- Card Konten -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-header bg-white border-bottom border-2 border-orange py-3 px-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
                <div>
                    <span class="badge bg-orange mb-1">Materi & Dokumen</span>
                    <h1 class="h3 fw-bold text-dark mb-0">Perencanaan Pembelajaran Mendalam</h1>
                </div>
                <a href="https://drive.google.com/file/d/1F9jA-muGd62rcu4PxLhnVCBgVXg2Kjdh/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-orange">
                    <i class="bi bi-box-arrow-up-right me-1"></i> Buka di Tab Baru
                </a>
            </div>
            
            <div class="card-body p-3 p-md-4 bg-white">
                <!-- Embed PDF Google Drive -->
                <div class="pdf-wrapper shadow-sm">
                    <iframe 
                        src="https://drive.google.com/file/d/1F9jA-muGd62rcu4PxLhnVCBgVXg2Kjdh/preview" 
                        allow="autoplay"
                        title="Perencanaan Pembelajaran Mendalam">
                    </iframe>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            &copy; <span id="year"></span> <strong class="text-orange">Yana Permana</strong> &mdash; Jadwal Lab Sharing
        </div>
    </footer>

    <!-- Tombol Floating To Top -->
    <button type="button" class="btn btn-orange d-flex align-items-center justify-content-center" id="btn-back-to-top" title="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Script untuk Tombol Back & To Top -->
    <script>
        // Set tahun otomatis di footer
        document.getElementById("year").textContent = new Date().getFullYear();

        // Fungsi tombol kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika halaman dibuka langsung di tab baru tanpa riwayat sebelumnya
                window.location.href = "https://yanapermana.github.io";
            }
        }

        // Fungsi tombol To Top
        const backToTopBtn = document.getElementById("btn-back-to-top");

        window.onscroll = function () {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                backToTopBtn.style.setProperty("display", "flex", "important");
            } else {
                backToTopBtn.style.setProperty("display", "none", "important");
            }
        };

        backToTopBtn.addEventListener("click", function () {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    </script>
</body>
</html>
