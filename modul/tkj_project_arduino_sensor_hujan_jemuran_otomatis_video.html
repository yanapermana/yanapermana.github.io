<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Arduino Sensor Hujan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --rain-deep: #0f2a3d;
      --rain-mid: #1d5470;
      --rain-light: #e8f3f8;
      --rain-accent: #2fa4c7;
    }
    body { background: var(--rain-light); color: var(--rain-deep); }
    .site-header {
      background: linear-gradient(160deg, var(--rain-deep), var(--rain-mid));
      color: #fff;
    }
    .site-header h1 { font-weight: 700; letter-spacing: -0.5px; }
    .site-header p { color: #cfe6f0; max-width: 40rem; }
    .video-card {
      border: 0;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 42, 61, .18);
      margin-top: -2.5rem;
    }
    .video-card .ratio { background: #000; }
    footer { color: var(--rain-mid); }
  </style>
</head>
<body>

  <header class="site-header py-5">
    <div class="container py-3 pb-5">
      <h1 class="display-5 mb-3">Project Arduino Sensor Hujan</h1>
      <p class="lead mb-0">Video demonstrasi proyek sensor hujan menggunakan Arduino.</p>
    </div>
  </header>

  <main class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <div class="card video-card">
          <div class="ratio ratio-16x9">
            <iframe
              src="https://drive.google.com/file/d/1ivqGZMJcXUrvVCKVJnsGX08dvrU8fM7i/preview"
              title="Video Project Arduino Sensor Hujan"
              allow="autoplay; fullscreen"
              allowfullscreen
              loading="lazy"></iframe>
          </div>
          <div class="card-body p-3 p-md-4 bg-white">
            <h2 class="h5 mb-1">Demo Sensor Hujan</h2>
            <p class="text-secondary mb-0 small">Jika video tidak tampil, buka langsung di
              <a href="https://drive.google.com/file/d/1ivqGZMJcXUrvVCKVJnsGX08dvrU8fM7i/view?usp=drive_link" target="_blank" rel="noopener">Google Drive</a>.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center pb-4 small">
    &copy; <span id="year"></span> Project Arduino Sensor Hujan
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
