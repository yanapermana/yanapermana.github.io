<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaringan Komputer Materi 6</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Variabel Tema Oranye & Putih */
        :root {
            --primary-orange: #f97316;
            --dark-orange: #ea580c;
            --light-orange: #fff7ed;
            --border-orange: #fed7aa;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #334155;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar-custom {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 10px rgba(249, 115, 22, 0.25);
        }

        .navbar-custom .navbar-brand {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-custom .nav-link {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            transition: all 0.2s ease;
            border-radius: 6px;
            padding: 8px 15px !important;
        }

        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: var(--primary-orange);
            background-color: #ffffff;
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        /* Header / Judul Materi */
        .header-banner {
            background-color: var(--light-orange);
            border-bottom: 2px solid var(--border-orange);
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .header-banner h1 {
            color: var(--dark-orange);
            font-weight: 800;
            margin: 0;
        }

        /* PDF Embed Container */
        .pdf-card {
            border: 1px solid var(--border-orange);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }

        .pdf-wrapper {
            position: relative;
            width: 100%;
            height: 80vh; /* Responsif menyesuaikan tinggi layar */
            min-height: 550px;
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol Kustom */
        .btn-orange {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            color: #ffffff;
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            background-color: #ffffff;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Floating Back to Top Button */
        #btn-back-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: none;
            z-index: 999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
            align-items: center;
            justify-content: center;
        }

        /* Footer */
        footer {
            margin-top: auto;
            background-color: var(--light-orange);
            border-top: 1px solid var(--border-orange);
            color: #64748b;
        }
    </style>
</head>
<body id="top">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://yanapermana.github.io">
                <i class="bi bi-hdd-network me-2"></i>Yana Permana
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="header-banner">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <span class="badge bg-white text-dark border border-warning mb-2 px-3 py-2">Jaringan Komputer</span>
                    <h1>Materi 6 VLAN</h1>
                </div>
                <div>
                    <!-- Tombol Back ke Halaman Sebelumnya -->
                    <button onclick="goBack()" class="btn btn-outline-orange">
                        <i class="bi bi-arrow-left me-1"></i> Kembali
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mb-5">
        <div class="pdf-card">
            <div class="p-3 bg-white border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span class="fw-semibold text-secondary">
                    <i class="bi bi-file-earmark-pdf-fill text-danger me-1"></i> Dokumen Modul Pembelajaran
                </span>
                <a href="https://drive.google.com/file/d/1Uh0cNfHPgi-27aDTkPpX398Eb5jV-NIy/view?usp=drive_link" target="_blank" class="btn btn-sm btn-orange">
                    <i class="bi bi-box-arrow-up-right me-1"></i> Buka di Tab Baru
                </a>
            </div>
            
            <!-- Embed PDF Google Drive -->
            <div class="pdf-wrapper">
                <iframe 
                    src="https://drive.google.com/file/d/1Uh0cNfHPgi-27aDTkPpX398Eb5jV-NIy/preview" 
                    allow="autoplay"
                    title="Materi 6 VLAN">
                </iframe>
            </div>
        </div>

        <!-- Navigasi Bawah -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <button onclick="goBack()" class="btn btn-outline-orange">
                <i class="bi bi-arrow-left me-1"></i> Halaman Sebelumnya
            </button>
            <a href="#top" class="btn btn-orange">
                <i class="bi bi-arrow-up me-1"></i> Ke Atas
            </a>
        </div>
    </main>

    <!-- Floating Button To Top -->
    <button type="button" class="btn btn-orange" id="btn-back-to-top" title="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <small>&copy; 2026 <strong>Yana Permana</strong>. Jaringan Komputer - Materi 6 VLAN.</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript untuk tombol Back & To Top -->
    <script>
        // Fungsi kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika halaman dibuka langsung di tab baru tanpa riwayat sebelumnya
                window.location.href = "https://yanapermana.github.io/modul/index.html";
            }
        }

        // Kontrol tombol melayang "To Top" saat halaman di-scroll
        const mybutton = document.getElementById("btn-back-to-top");

        window.onscroll = function () {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                mybutton.style.display = "flex";
            } else {
                mybutton.style.display = "none";
            }
        };

        mybutton.addEventListener("click", function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
