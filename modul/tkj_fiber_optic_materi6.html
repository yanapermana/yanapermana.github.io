<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Optic Materi 6</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #f97316;
            --dark-orange: #ea580c;
            --light-orange: #fff7ed;
            --border-orange: #fed7aa;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar-custom {
            background-color: var(--primary-orange);
            box-shadow: 0 2px 10px rgba(249, 115, 22, 0.25);
        }

        .navbar-custom .navbar-brand {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-custom .nav-link {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            transition: color 0.2s ease, background-color 0.2s ease;
            border-radius: 6px;
            padding: 0.5rem 1rem !important;
        }

        .navbar-custom .nav-link:hover {
            color: var(--primary-orange);
            background-color: #ffffff;
        }

        /* Main Content Card */
        .content-card {
            background-color: #ffffff;
            border: 1px solid var(--border-orange);
            border-top: 5px solid var(--primary-orange);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .heading-title {
            color: var(--dark-orange);
            font-weight: 700;
        }

        /* Button Styling */
        .btn-orange {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-outline-orange {
            color: var(--primary-orange);
            border: 1.5px solid var(--primary-orange);
            background-color: #ffffff;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Video Container */
        .video-wrapper {
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-orange);
            background-color: #000000;
        }

        /* Floating To Top Button */
        #btnToTop {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 99;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
        }

        /* Footer */
        footer {
            background-color: var(--light-orange);
            border-top: 1px solid var(--border-orange);
            margin-top: auto;
        }
    </style>
</head>
<body id="top">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://yanapermana.github.io">
                <i class="bi bi-router-fill me-2"></i>Yana Permana
            </a>
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1 mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4 my-md-5">
        <!-- Tombol Back ke Halaman Sebelumnya -->
        <div class="mb-3">
            <button onclick="goBack()" class="btn btn-outline-orange btn-sm px-3 py-2">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Sebelumnya
            </button>
        </div>

        <!-- Card Materi -->
        <div class="content-card p-3 p-md-5">
            <span class="badge mb-2 px-3 py-2" style="background-color: var(--light-orange); color: var(--dark-orange); border: 1px solid var(--border-orange);">
                Modul Pembelajaran Fiber Optic
            </span>
            
            <h1 class="heading-title h2 h1-md mb-4">
                Materi 6 Setting Routing Border Gateway Protocol (BGP)
            </h1>

            <!-- Embed Video Google Drive Responsif (16:9) -->
            <div class="ratio ratio-16x9 video-wrapper shadow-sm">
                <iframe 
                    src="https://drive.google.com/file/d/1nlw4lsc8CWsEgm4vKYdaZRSPwVFfkC23/preview" 
                    title="Materi 6 Setting Routing Border Gateway Protocol (BGP)"
                    allow="autoplay; fullscreen" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Navigasi Bawah -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mt-4 pt-3 border-top">
                <button onclick="goBack()" class="btn btn-outline-orange">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </button>
                <a href="#top" class="btn btn-orange">
                    <i class="bi bi-arrow-up me-1"></i> To Top
                </a>
            </div>
        </div>
    </main>

    <!-- Floating Button To Top (Muncul saat halaman di-scroll) -->
    <button onclick="scrollToTop()" id="btnToTop" class="btn btn-orange" title="Kembali ke atas">
        <i class="bi bi-chevron-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center text-muted small">
        <div class="container">
            &copy; 2026 <strong>Yana Permana</strong> &mdash; Fiber Optic Materi 6
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Script untuk tombol Back dan To Top -->
    <script>
        // Fungsi kembali ke halaman sebelumnya
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika dibuka langsung di tab baru tanpa riwayat sebelumnya
                window.location.href = "https://yanapermana.github.io/modul/index.html";
            }
        }

        // Kontrol tombol mengambang To Top saat scroll
        const btnToTop = document.getElementById("btnToTop");

        window.onscroll = function () {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                btnToTop.style.display = "flex";
            } else {
                btnToTop.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
