<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Mikrotik DHCP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons for back/top icons (optional, but nice) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* ===== TEMA ORANGE & PUTIH ===== */
    :root {
      --orange-primary: #f97316;   /* orange utama */
      --orange-dark:    #ea580c;   /* orange tua (hover/header) */
      --orange-darker:  #c2410c;   /* orange sangat tua (teks) */
      --orange-soft:    #fff7ed;   /* orange sangat muda (background hover) */
      --orange-border:  #fdba74;   /* border orange lembut */
      --putih:          #ffffff;
      --teks:           #3f2a1d;   /* coklat-orange gelap untuk teks */
    }

    body { background: #fffaf5; color: var(--teks); }

    /* Header: orange tua dengan border orange terang */
    .site-header {
      background: var(--orange-dark);
      color: var(--putih);
      border-bottom: 4px solid var(--orange-primary);
    }
    .site-header h1 { font-weight: 700; letter-spacing: .2px; }
    .site-header p { color: #ffe9d6; }

    .pdf-frame { position: relative; width: 100%; height: 80vh; min-height: 480px; background: var(--putih); }
    .pdf-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    @media (max-width: 576px) { .pdf-frame { height: 70vh; } }

    /* Navbar putih dengan aksen orange */
    .navbar-custom {
      background-color: var(--putih);
      border-bottom: 1px solid var(--orange-border);
      box-shadow: 0 2px 6px rgba(249, 115, 22, 0.08);
    }
    .navbar-custom .nav-link {
      color: var(--orange-darker);
      font-weight: 500;
      padding: 0.6rem 1rem;
      border-radius: 0.375rem;
      transition: background-color 0.2s, color 0.2s;
    }
    .navbar-custom .nav-link:hover,
    .navbar-custom .nav-link:focus {
      background-color: var(--orange-soft);
      color: var(--orange-dark);
    }
    .navbar-custom .nav-link.active {
      background-color: var(--orange-primary);
      color: var(--putih) !important;
    }

    /* Tombol back */
    .btn-back-top {
      border-radius: 2rem;
      padding: 0.5rem 1.25rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.15);
    }
    .btn-back-top.btn-outline-secondary {
      color: var(--orange-dark);
      border-color: var(--orange-primary);
    }
    .btn-back-top.btn-outline-secondary:hover {
      background-color: var(--orange-primary);
      border-color: var(--orange-primary);
      color: var(--putih);
    }

    /* Tombol to top: orange */
    .btn-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 1050;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--orange-primary);
      color: var(--putih);
      border: none;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
      transition: background-color 0.2s, transform 0.2s;
    }
    .btn-to-top:hover {
      background-color: var(--orange-dark);
      color: var(--putih);
      transform: scale(1.05);
    }
    .btn-to-top i { font-size: 1.5rem; }

    /* Tombol outline-primary jadi orange */
    .btn-outline-primary {
      color: var(--orange-dark);
      border-color: var(--orange-primary);
    }
    .btn-outline-primary:hover,
    .btn-outline-primary:focus {
      background-color: var(--orange-primary);
      border-color: var(--orange-primary);
      color: var(--putih);
    }

    /* Card & header card */
    .card-header.bg-white { background-color: var(--putih) !important; }
    .card-header .fw-semibold { color: var(--orange-darker); }

    /* Footer */
    footer.text-muted { color: #a0673f !important; }

    /* Supaya tombol to top tidak menutupi footer di mobile */
    @media (max-width: 576px) {
      .btn-to-top {
        bottom: 1.25rem;
        right: 1.25rem;
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>

  <!-- Header (tetap) -->
  <header class="site-header py-4">
    <div class="container">
      <h1 class="h2 mb-1">Project Mikrotik DHCP</h1>
      <p class="mb-0 opacity-75">Dokumen konfigurasi DHCP Server pada Mikrotik</p>
    </div>
  </header>

  <!-- MENU / NAVBAR -->
  <nav class="navbar navbar-expand navbar-custom py-2">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center gap-2 w-100">
        <!-- Button Back ke halaman sebelumnya -->
        <button onclick="history.back()" class="btn btn-outline-secondary btn-back-top me-md-3">
          <i class="bi bi-arrow-left"></i> Back
        </button>

        <!-- Menu links -->
        <div class="navbar-nav d-flex flex-row flex-wrap gap-2 ms-auto ms-md-0">
          <a class="nav-link" href="https://yanapermana.github.io">Yana Permana</a>
          <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
          <a class="nav-link" href="https://yanapermana.github.io/modul/index.html">Modul</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container my-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="fw-semibold">Dokumen Project</span>
        <a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener"
           href="https://drive.google.com/file/d/1vJwyGdy4avS9uRYHK3FNGyWuDX_-YzeA/view">Buka di tab baru</a>
      </div>
      <div class="pdf-frame">
        <iframe src="https://drive.google.com/file/d/1vJwyGdy4avS9uRYHK3FNGyWuDX_-YzeA/preview"
                title="Project Mikrotik DHCP (PDF)" allow="autoplay" loading="lazy"></iframe>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-muted small pb-4">
    &copy; 2026 Project Mikrotik DHCP
  </footer>

  <!-- Tombol To Top (fixed) -->
  <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="btn-to-top" aria-label="Kembali ke atas">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
