<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Optic Materi 2</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons untuk ikon tombol -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Pengaturan Tema Warna Orange & Putih */
        :root {
            --primary-orange: #ff6600;
            --dark-orange: #e65c00;
            --light-orange: #fff3eb;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Styling Navbar */
        .navbar-custom {
            background-color: var(--primary-orange);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }

        .navbar-custom .nav-link:hover {
            color: var(--light-orange) !important;
            text-decoration: underline;
        }

        /* Styling Judul Utama */
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
            border-bottom: 3px solid var(--primary-orange);
            padding-bottom: 10px;
            display: inline-block;
        }

        /* Styling Tombol Kustom */
        .btn-orange {
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-orange:hover {
            background-color: var(--dark-orange);
            color: #ffffff;
        }

        /* Container Responsif untuk PDF Google Drive */
        .pdf-container {
            position: relative;
            width: 100%;
            height: 80vh; /* Tinggi otomatis 80% dari tinggi layar */
            min-height: 500px;
            border: 2px solid var(--primary-orange);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.15);
            background-color: var(--light-orange);
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol Floating Back to Top */
        #btn-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: none; /* Sembunyi saat di paling atas */
            z-index: 99;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        footer {
            margin-top: auto;
            background-color: var(--light-orange);
            border-top: 2px solid var(--primary-orange);
        }
    </style>
</head>
<body id="top">

    <!-- Menu Navigasi -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="https://yanapermana.github.io">
                <i class="bi bi-broadcast-pin me-2"></i>Yana Permana
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://yanapermana.github.io/jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="https://yanapermana.github.io/modul/index.html">Modul</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="container my-4">
        
        <!-- Baris Tombol Back -->
        <div class="mb-3">
            <button onclick="history.back()" class="btn btn-orange btn-sm shadow-sm">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Sebelumnya
            </button>
        </div>

        <!-- Judul Heading 1 -->
        <div class="mb-4">
            <h1 class="page-title h2">Materi 2 Jaringan Fiber to The X (FTTX)</h1>
        </div>

        <!-- Embed PDF Google Drive -->
        <!-- Catatan: URL '/view' diubah menjadi '/preview' agar dapat di-embed dengan baik -->
        <div class="pdf-container mb-4">
            <iframe 
                src="https://drive.google.com/file/d/1WGZ3Jru0QpAPTGHndpjXzPUbXaHGr8ET/preview" 
                allow="autoplay"
                title="Materi 2 Jaringan Fiber to The X (FTTX)">
            </iframe>
        </div>

        <!-- Opsi Unduh/Buka Langsung jika browser memblokir iframe -->
        <div class="text-end mb-4">
            <a href="https://drive.google.com/file/d/1WGZ3Jru0QpAPTGHndpjXzPUbXaHGr8ET/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn btn-outline-warning text-dark border-warning btn-sm">
                <i class="bi bi-box-arrow-up-right me-1"></i> Buka PDF di Tab Baru
            </a>
        </div>

    </main>

    <!-- Tombol Floating To Top -->
    <button onclick="scrollToTop()" id="btn-to-top" class="btn btn-orange" title="Kembali ke atas">
        <i class="bi bi-arrow-up fs-5"></i>
    </button>

    <!-- Footer -->
    <footer class="py-3 text-center text-muted small">
        <div class="container">
            &copy; 2026 Yana Permana - Modul Pembelajaran Fiber Optic
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script untuk Fungsi Tombol To Top -->
    <script>
        const btnToTop = document.getElementById("btn-to-top");

        // Tampilkan tombol saat pengguna scroll ke bawah sejauh 150px
        window.onscroll = function() {
            if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
                btnToTop.style.display = "block";
            } else {
                btnToTop.style.display = "none";
            }
        };

        // Fungsi scroll halus ke atas
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
